name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: drill-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Drill.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Drill.apk --title "Drill (latest build)" --notes "Install Drill.apk on your phone."
