name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "digest/**"
      - "**.md"
      - "dragonfly/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APKs (Drill and Sthira)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|FAILED|What went wrong|Could not|not found|Unresolved|AAPT" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }

      - name: Sthira unit tests
        run: ./gradlew :sthira:testDebugUnitTest --no-daemon

      - name: Keep the APKs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            sthira/build/outputs/apk/debug/sthira-debug.apk

      - name: Publish to the "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Drill.apk
          cp sthira/build/outputs/apk/debug/sthira-debug.apk Sthira.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Drill.apk Sthira.apk --title "Latest builds" --notes "Install Drill.apk or Sthira.apk on your phone."
